<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zomato Card</title>
  <link rel="stylesheet" href="zomatoproject.css">
</head>
<body>
  <div class="card">
    <!-- Image -->
    <div class="image">
      <img src="image.png" alt="restaurant pic" class="img">
    </div>

    <!-- Restaurant section -->
    <div class="Restaurant">
      <div class="Restaurant_name Box">
        <p>The Darzi Bar and Kitchen</p>
      </div>
      <div class="rating Box">
        <p>4.2★</p>
      </div>
      <div class="price Box">
        <p>2800 for two</p>
      </div>
      <div class="Distance Box">
        <p>1.4Km</p>
      </div>
    </div>

    <!-- Food info -->
    <div class="food">
      <div class="food_name Box">
        <p>North Indian, Chinese</p>
      </div>
    </div>

    <!-- Location -->
    <div class="location">
      <div class="Place Box">
        <p>Middle Circle, CP</p>
      </div>
    </div>
  </div>
</body>
</html>
